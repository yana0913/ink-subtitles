<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨迹 · 手写字幕工坊</title><link rel="stylesheet" href="style.css"><body><header><a class="brand" href="#">墨迹 <span>INK / SUBTITLES</span></a><span class="local">● 照片仅在本机处理</span></header><main><section class="intro"><small>FOR YOUR EVERYDAY FILMS</small><h1>让你的字，<br>成为电影的一部分<span>。</span></h1><p>写下歌词，拍一张照。把真实的笔迹变成透明字幕，<br>留给弹唱、旅行，和生活里值得记录的片刻。</p></section><section class="studio"><aside><label id="drop" class="drop"><b>＋</b><strong>把手写照片放进来</strong><span>点击选择或拖入多张图片<br>支持 JPG、PNG、WebP · 每张最多 25 MB</span><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label><button id="demo" class="text">先用示例试试看 ↗</button><div class="settings"><h3>01 / 提取笔迹</h3><label>去底强度 <output id="thresholdLabel">165</output><input id="threshold" type="range" min="40" max="245" value="165"></label><label>分行间距 <output id="gapLabel">12</output><input id="gap" type="range" min="2" max="60" value="12"></label><p class="hint">干净白纸、深色笔、正面拍摄效果更好。调低去底强度可减少纸张阴影。</p><h3>02 / 字幕样式</h3><label>笔迹颜色<select id="color"><option value="#ffffff">白色 · 适合视频</option><option value="#171717">黑色 · 适合浅背景</option><option value="original">保留原色</option><option value="#ed865a">暖橙</option></select></label><label>导出方式<select id="format"><option value="tight">紧贴笔迹 · 透明 PNG</option><option value="frame">1920 × 1080 · 底部居中</option></select></label><label>字幕宽度（画布模式）<input id="width" type="range" min="20" max="90" value="65"></label><label class="check"><input id="shadow" type="checkbox" checked> 加一点阴影，提高视频可读性</label><button id="process" class="primary" disabled>提取全部照片 ↗</button></div></aside><div class="workspace"><div class="toolbar"><h2>你的手写工作台</h2><span id="count">等待照片</span></div><div id="sources"></div><div id="empty" class="empty"><div class="handwriting">把日子写成一首歌</div><p>原本的笔画，原本的你。</p><span>上传 → 提取 → 下载 → 放进剪辑时间线</span></div><div id="results" class="results"></div><div class="bottom"><p id="status" role="status" aria-live="polite">透明背景 PNG，可以放进剪映、Premiere 或 Final Cut。</p><button id="download" class="primary" disabled>打包下载 PNG ↓</button></div></div></section><footer>一点笔迹，一点生活。 <span>INK STUDIO / 01</span></footer></main><script src="core.js"></script><script src="app.js"></script></body></html>
